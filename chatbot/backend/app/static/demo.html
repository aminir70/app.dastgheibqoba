<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نمونه‌ی ویجت چت</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  body{font-family:Vazirmatn,sans-serif;background:#f4f1ea;color:#10221f;margin:0;
    min-height:100vh;display:grid;place-items:center;padding:24px}
  .box{max-width:560px;text-align:center;background:#fff;border:1px solid #e4ded2;
    border-radius:18px;padding:40px;box-shadow:0 8px 24px rgba(16,34,31,.06)}
  h1{margin:0 0 10px}
  p{color:#6b7b76;line-height:2}
  code{background:#f4f1ea;padding:3px 7px;border-radius:6px;direction:ltr;display:inline-block}
</style>
</head>
<body>
  <div class="box">
    <h1>صفحه‌ی نمونه</h1>
    <p>ویجت چت در گوشه‌ی پایین‌ـچپ صفحه قرار دارد. روی دکمه‌ی 💬 کلیک کنید.</p>
    <p>برای افزودن این ویجت به هر سایت دیگری، فقط این خط را قبل از <code>&lt;/body&gt;</code> بگذارید:</p>
    <p><code>&lt;script src="https://YOUR-DOMAIN/static/widget.js"&gt;&lt;/script&gt;</code></p>
  </div>

  <!-- The widget. data-api defaults to this script's origin. -->
  <script src="/static/widget.js" data-title="دستیار پاسخگو"></script>
</body>
</html>
